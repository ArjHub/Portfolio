name: Build portfolio

on:
  push:
    branches: [main, editorial-blog-refinement]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Verify generated blog routes
        run: |
          test -s dist/blog/index.html
          test -s dist/blog/data-pipeline-observability/index.html
          grep -q 'data-pipeline-observability' dist/sitemap.xml
